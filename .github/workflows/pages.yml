name: GitHub Pages

env:
  NODE_VERSION: "20"

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Generate added dates
        run: node scripts/generate-added-dates.js

      - name: Generate OG images
        run: node scripts/generate-og.mjs

      - name: Check OG freshness (advisory)
        run: |
          if ! git diff --quiet -- assets/images/og 2>/dev/null; then
            echo "::warning::OG images stale — run node scripts/generate-og.mjs locally and commit"
            git diff --stat -- assets/images/og || true
          else
            echo "OG images fresh"
          fi

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
