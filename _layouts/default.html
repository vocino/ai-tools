<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Source+Serif+4:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="sitemap" type="application/xml" title="Sitemap" href="{{ '/sitemap.xml' | absolute_url }}">
  {% if page.json_ld %}
  <script type="application/ld+json">{{ page.json_ld }}</script>
  {% endif %}
</head>
<body class="site-root">
  {% include nav.html %}
  <div class="ai-shell__body">
    {{ content }}
  </div>
  <script src="https://code.iconify.design/iconify-icon/2.0.0/iconify-icon.min.js" defer></script>
  <script src="{{ '/assets/js/filter.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
