title: "AI Tools Directory — Open Directory of 209 AI Tools"
description: "Open directory of 209 AI tools I keep for my coding agents. Browse coding, video, writing, chat & design tools by category, pricing & API."
url: "https://ai.vocino.com"
baseurl: ""
# Verification — add values from GSC / Bing Webmaster when available
webmaster_verifications:
  google: # paste GSC HTML tag value here, then jekyll-seo-tag emits <meta name="google-site-verification">
  bing: # paste Bing verification value here
  # yandex / baidu if needed
# IndexNow — generate key via https://www.bing.com/indexnow/getstarted then set
# indexnow_key: "your-32-char-hex"

author:
  name: "Vocino"
  url: "https://vocino.com"

twitter:
  username: vocino
  card: summary_large_image

social:
  name: "Vocino"
  links:
    - https://threads.com/@vocino
    - https://vocino.com

collections:
  tools:
    output: true
    permalink: /tools/:slug/
    sort_by: name

defaults:
  - scope:
      path: ""
      type: "tools"
    values:
      layout: "tool"
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.png

plugins:
  - jekyll-seo-tag

titles_from_headings:
  enabled: false

include:
  - _redirects

# Headers for Cloudflare / GH Pages edge — documented in _headers, applied via Cloudflare rules
# See https://developers.cloudflare.com/pages/configuration/headers/

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - CONTRIBUTING.md
  - .github
  - validate.js
  - package.json
  - package-lock.json

sass:
  style: compressed
