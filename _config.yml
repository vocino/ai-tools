title: "AI Tools by Vocino"
description: "A curated directory of AI tools, services and platforms — by Vocino. Discover the best AI tools for building, creating, and shipping."
url: "https://ai.vocino.com"
baseurl: ""

author:
  name: "Vocino"
  url: "https://vocino.com"

twitter:
  username: vocino
  card: summary_large_image

social:
  name: "Vocino"
  links:
    - https://threads.com/@vocino
    - https://vocino.com

collections:
  tools:
    output: true
    permalink: /tools/:slug/
    sort_by: name

defaults:
  - scope:
      path: ""
      type: "tools"
    values:
      layout: "tool"
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.png

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

include:
  - _redirects

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
  - CONTRIBUTING.md
  - .github
  - validate.js
  - package.json
  - package-lock.json

sass:
  style: compressed
